<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)" />
  <title>HonestShelf · Honest reviews for daily essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo" aria-label="HonestShelf home">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor" />
          <path d="M7 22.5h18M9 22.5V12m14 10.5V12" stroke="var(--on-brand)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".45" />
          <path d="m11 14.5 3.5 3.5 6.5-7" stroke="var(--on-brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <span>Honest<b>Shelf</b></span>
      </a>
      <span class="topbar-note">No paid reviews. Ever.</span>
      <button class="btn btn-primary btn-sm" type="button" data-open-scan>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        <span>Scan a pack</span>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="loading-line">Loading…</p>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-brand">HonestShelf</span>
      <span>Reviews are written by shoppers in their own words. “Photo verified” means the reviewer’s photo matched the product. Reviews tagged “Demo” are sample data. Product photos: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener noreferrer">Open Food Facts</a> contributors, CC BY-SA 3.0.</span>
    </div>
  </footer>

  <dialog id="write-dialog" class="sheet" aria-labelledby="write-title"></dialog>
  <dialog id="scan-dialog" class="sheet" aria-labelledby="scan-title"></dialog>
  <dialog id="ask-dialog" class="sheet chat-sheet" aria-labelledby="ask-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
